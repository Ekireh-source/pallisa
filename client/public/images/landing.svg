<svg width="585" height="589" viewBox="0 0 585 589" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="585" height="589" rx="20" fill="#F8FAFC"/>
  
  <!-- Main Dashboard Screen -->
  <rect x="50" y="80" width="485" height="320" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="50" y="80" width="485" height="60" rx="12" fill="#3B82F6"/>
  <rect x="50" y="128" width="485" height="12" fill="#3B82F6"/>
  
  <!-- Navigation dots -->
  <circle cx="80" cy="110" r="6" fill="white" opacity="0.8"/>
  <circle cx="100" cy="110" r="6" fill="white" opacity="0.6"/>
  <circle cx="120" cy="110" r="6" fill="white" opacity="0.4"/>
  
  <!-- Title -->
  <rect x="200" y="100" width="180" height="20" rx="4" fill="white" opacity="0.9"/>
  
  <!-- Cards/Expenses -->
  <rect x="80" y="170" width="120" height="80" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <rect x="220" y="170" width="120" height="80" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <rect x="360" y="170" width="120" height="80" rx="8" fill="#FEF3C7" stroke="#FDE68A"/>
  
  <!-- Card details -->
  <circle cx="110" cy="190" r="8" fill="#3B82F6"/>
  <rect x="90" y="210" width="60" height="8" rx="2" fill="#6B7280"/>
  <rect x="90" y="225" width="40" height="6" rx="2" fill="#9CA3AF"/>
  
  <circle cx="250" cy="190" r="8" fill="#10B981"/>
  <rect x="230" y="210" width="60" height="8" rx="2" fill="#6B7280"/>
  <rect x="230" y="225" width="40" height="6" rx="2" fill="#9CA3AF"/>
  
  <circle cx="390" cy="190" r="8" fill="#F59E0B"/>
  <rect x="370" y="210" width="60" height="8" rx="2" fill="#6B7280"/>
  <rect x="370" y="225" width="40" height="6" rx="2" fill="#9CA3AF"/>
  
  <!-- Chart Area -->
  <rect x="80" y="280" width="400" height="100" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  
  <!-- Chart bars -->
  <rect x="100" y="320" width="20" height="40" rx="2" fill="#3B82F6"/>
  <rect x="140" y="310" width="20" height="50" rx="2" fill="#10B981"/>
  <rect x="180" y="300" width="20" height="60" rx="2" fill="#F59E0B"/>
  <rect x="220" y="315" width="20" height="45" rx="2" fill="#EF4444"/>
  <rect x="260" y="305" width="20" height="55" rx="2" fill="#8B5CF6"/>
  <rect x="300" y="295" width="20" height="65" rx="2" fill="#06B6D4"/>
  <rect x="340" y="325" width="20" height="35" rx="2" fill="#84CC16"/>
  <rect x="380" y="318" width="20" height="42" rx="2" fill="#F97316"/>
  <rect x="420" y="308" width="20" height="52" rx="2" fill="#EC4899"/>
  
  <!-- Floating elements -->
  <!-- Dollar sign -->
  <circle cx="150" cy="50" r="25" fill="#10B981" opacity="0.1"/>
  <text x="150" y="58" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10B981">$</text>
  
  <!-- Receipt icon -->
  <rect x="450" y="30" width="30" height="40" rx="4" fill="#3B82F6" opacity="0.1"/>
  <rect x="455" y="35" width="20" height="3" rx="1" fill="#3B82F6"/>
  <rect x="455" y="42" width="15" height="2" rx="1" fill="#3B82F6"/>
  <rect x="455" y="47" width="18" height="2" rx="1" fill="#3B82F6"/>
  <rect x="455" y="52" width="12" height="2" rx="1" fill="#3B82F6"/>
  
  <!-- Calendar -->
  <rect x="420" y="450" width="40" height="35" rx="4" fill="#F59E0B" opacity="0.1"/>
  <rect x="425" y="455" width="30" height="3" rx="1" fill="#F59E0B"/>
  <circle cx="430" cy="470" r="2" fill="#F59E0B"/>
  <circle cx="438" cy="470" r="2" fill="#F59E0B"/>
  <circle cx="446" cy="470" r="2" fill="#F59E0B"/>
  <circle cx="454" cy="470" r="2" fill="#F59E0B"/>
  
  <!-- Analytics icon -->
  <circle cx="100" cy="480" r="20" fill="#8B5CF6" opacity="0.1"/>
  <path d="M90 485 L95 475 L100 480 L105 470 L110 475" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  
  <!-- Decorative elements -->
  <circle cx="500" cy="150" r="3" fill="#3B82F6" opacity="0.3"/>
  <circle cx="520" cy="180" r="2" fill="#10B981" opacity="0.4"/>
  <circle cx="40" cy="200" r="2" fill="#F59E0B" opacity="0.4"/>
  <circle cx="60" cy="400" r="3" fill="#EF4444" opacity="0.3"/>
  <circle cx="550" cy="400" r="2" fill="#8B5CF6" opacity="0.4"/>
</svg> 